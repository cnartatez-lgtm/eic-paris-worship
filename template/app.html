<meta charset="utf-8">
<title>EIC Paris · Worship</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D637F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ------------------------------------------------------------------
   EIC Paris · Worship
   Colours and type follow eicparis.org: teal #2D637F, orange #CD5A13,
   Poppins. The orange is reserved for chords — on a music stand the
   thing the eye hunts for is the chord, so it gets the one loud
   colour on the page and nothing else competes with it.
   Built to be opened from a local file on a 10" tablet, so nothing
   here needs the network.
------------------------------------------------------------------ */
:root{
  --teal:#2D637F; --orange:#CD5A13;
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF1F4;
  --ink:#2C2D2E; --ink-soft:#616262; --line:#DCE3E8;
  --chord:#C24F0B; --accent:#2D637F;
  --shadow:0 1px 2px rgba(20,40,55,.06),0 4px 16px rgba(20,40,55,.07);
  --radius:14px;
  --song-size:20px;   /* driven by the A- / A+ control */
  --ease:cubic-bezier(.22,.61,.36,1);
}
:root[data-theme="dark"]{
  --bg:#12171A; --surface:#1B2226; --surface-2:#232B31;
  --ink:#E9EDF0; --ink-soft:#9BA8B0; --line:#2C363D;
  --chord:#FF9247; --accent:#8FCADE;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Poppins",-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-text-size-adjust:100%;
  overscroll-behavior:none;
  transition:background .3s var(--ease), color .3s var(--ease);
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------------- top bar ---------------- */
.bar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;gap:14px;
  padding:10px 18px;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:30px;height:30px;border-radius:9px;flex:none;
  background:linear-gradient(140deg,var(--teal),#3C7F9E);
  display:grid;place-items:center;
  color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px;
  box-shadow:0 2px 8px rgba(45,99,127,.35);
}
.brand b{font-size:15px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand span{font-size:11px;color:var(--ink-soft);white-space:nowrap}
.spacer{flex:1}

.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:11px}
.tab{
  padding:8px 18px;border-radius:8px;font-size:13.5px;font-weight:500;
  color:var(--ink-soft);transition:all .22s var(--ease);
}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab:active{transform:scale(.96)}

.icon{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:var(--ink-soft);transition:all .2s var(--ease);flex:none;
}
.icon:hover{background:var(--surface-2);color:var(--ink)}
.icon:active{transform:scale(.9)}
.icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.icon.on{color:var(--orange);background:color-mix(in srgb,var(--orange) 13%,transparent)}
.icon{position:relative}
.icon>b{position:absolute;right:2px;bottom:0;font-size:9px;font-weight:700;
  background:var(--surface);border-radius:4px;padding:0 2px;line-height:1.3}

/* ---------------- views ---------------- */
main{padding:22px 20px 60px;max-width:1500px;margin:0 auto}
.view{display:none;animation:rise .32s var(--ease)}
.view.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.lead{margin:0 0 20px}
.lead h1{margin:0 0 3px;font-size:25px;font-weight:600;letter-spacing:-.3px}
.lead p{margin:0;color:var(--ink-soft);font-size:13.5px}

.svc{display:flex;gap:8px;margin:0 0 20px;flex-wrap:wrap}
.svc button{
  padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  transition:all .22s var(--ease);
}
.svc button[aria-pressed="true"]{
  background:var(--teal);border-color:var(--teal);color:#fff;
  box-shadow:0 3px 10px rgba(45,99,127,.3);
}

/* ---------------- song cards ---------------- */
.grid{display:grid;gap:13px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.card{
  position:relative;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:17px 18px;box-shadow:var(--shadow);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease),border-color .24s var(--ease);
  animation:pop .38s var(--ease) backwards;
}
@keyframes pop{from{opacity:0;transform:translateY(11px) scale(.985)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-3px);box-shadow:0 5px 22px rgba(20,40,55,.13);border-color:color-mix(in srgb,var(--teal) 35%,var(--line))}
.card:active{transform:translateY(-1px) scale(.99)}
.card .n{
  position:absolute;top:15px;right:16px;font-size:11px;font-weight:600;
  color:var(--ink-soft);opacity:.5;
}
.card h3{margin:0 0 4px;font-size:16.5px;font-weight:600;line-height:1.3;padding-right:22px}
.card .by{margin:0 0 13px;font-size:12.5px;color:var(--ink-soft)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys i{
  font-style:normal;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;
  background:var(--surface-2);color:var(--ink-soft);letter-spacing:.3px;
}
.keys i.has{background:color-mix(in srgb,var(--teal) 13%,transparent);color:var(--teal)}
:root[data-theme="dark"] .keys i.has{color:var(--accent)}

.empty{
  padding:46px 20px;text-align:center;color:var(--ink-soft);font-size:14px;
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);
}

/* ---------------- song sheet ---------------- */
#sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;flex-direction:column}
#sheet.on{display:flex;animation:slide .3s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.shead{
  display:flex;align-items:center;gap:10px;padding:5px 11px;
  border-bottom:1px solid var(--line);background:var(--surface);flex:none;
}
.shead .t{min-width:0;flex:1}
.shead h2{margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.2px}
.shead .t span{font-size:11.5px;color:var(--ink-soft)}

.kpick{display:flex;gap:5px;background:var(--surface-2);padding:4px;border-radius:11px;flex:none}
.kpick button{
  min-width:46px;padding:8px 6px;border-radius:8px;font-size:15px;font-weight:600;
  color:var(--ink-soft);transition:all .22s var(--ease);
}
.kpick button[aria-pressed="true"]{
  background:var(--orange);color:#fff;box-shadow:0 2px 9px rgba(205,90,19,.4);
}
.kpick button:disabled{opacity:.28;cursor:not-allowed}
.kpick button:not(:disabled):active{transform:scale(.93)}

.sbody{flex:1;overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch}
.sheet-in{animation:fade .26s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.meta{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 7px}
.meta i{
  font-style:normal;font-size:10.5px;padding:1px 7px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-soft);
}

/* Two columns on a landscape tablet: the printed charts are laid
   out this way and it is what makes a 10" screen hold a whole song
   without scrolling mid-verse. */
.cols{column-gap:22px;column-rule:1px solid var(--line)}
.cols.c2{column-count:2}
.cols.c3{column-count:3}

.sec{break-inside:avoid;margin:0 0 9px}
.sec h4{
  margin:0 0 2px;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  color:var(--teal);opacity:.85;
}
:root[data-theme="dark"] .sec h4{color:var(--accent)}

/* ---- chords locked to their syllable ----
   Each word is a two-row inline grid: the chord in row 1, the word
   it is played on in row 2. The chord is therefore a child of its
   own word, not a thing positioned by column arithmetic, so it can
   never drift off the syllable — at any font size, any column
   width, any screen.

   The grid also settles the hard case: a chord wider than its word
   (Asus4 over "we"). The cell takes the width of whichever is
   wider, so the next word steps aside and two chords can never
   collide or overlap. Printed charts space out the same way.

   Row 1 is a fixed em height, so it scales with the text and every
   word on a line sits on the same baseline whether it carries a
   chord or not. Lines that have chords always reserve that row —
   two lyric lines can never close up and leave a chord nowhere to
   go. */
.ln{
  font-size:var(--song-size); line-height:1.22; font-weight:700;
  font-family:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
  white-space:normal; margin:0 0 1px; letter-spacing:-.2px;
}
.ln.c{margin-bottom:2px}
.ln.c .w{
  display:inline-grid; grid-template-rows:1.12em auto;
  justify-items:start; vertical-align:top;
}
.ln.c .w>b{
  grid-row:1; align-self:end; line-height:1;
  font-weight:800; font-size:.8em; color:var(--chord);
  letter-spacing:0; white-space:pre; padding-right:.5em;
}
.ln.c .w>i{grid-row:2; font-style:normal; white-space:pre}
.gap{height:.7em}

/* ---------------- floating size control ---------------- */
.fab{
  position:absolute;right:20px;bottom:20px;display:flex;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px;
  box-shadow:var(--shadow);padding:5px;z-index:5;
}
.fab button{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;
  font-size:15px;font-weight:600;color:var(--ink-soft);transition:all .18s var(--ease)}
.fab button:hover{background:var(--surface-2);color:var(--ink)}
.fab button:active{transform:scale(.88)}
.fab .lbl{font-size:11.5px;color:var(--ink-soft);min-width:34px;text-align:center;
  font-variant-numeric:tabular-nums}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,16px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  main{padding:16px 14px 50px}
  .cols.c2,.cols.c3{column-count:1}
  .brand span{display:none}
  .sbody{padding:8px 10px 12px}
}
@media print{.bar,.fab,.shead .kpick,.icon{display:none}}
</style>

<div class="bar">
  <div class="brand">
    <div class="mark">EIC</div>
    <div>
      <b>Worship</b><br><span id="sub">EIC Paris</span>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-view="set">Domingo</button>
    <button class="tab" role="tab" aria-selected="false" data-view="arch">Archivo</button>
  </div>
  <button class="icon" id="awake" title="Mantener la pantalla encendida">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
  </button>
  <button class="icon" id="theme" title="Modo noche">
    <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
</div>

<main>
  <section class="view on" id="v-set">
    <div class="lead">
      <h1 id="set-title">Domingo</h1>
      <p id="set-sub"></p>
    </div>
    <div class="svc" id="svc"></div>
    <div class="grid" id="set-grid"></div>
  </section>

  <section class="view" id="v-arch">
    <div class="lead">
      <h1>Archivo</h1>
      <p id="arch-sub"></p>
    </div>
    <div class="grid" id="arch-grid"></div>
  </section>
</main>

<div id="sheet">
  <div class="shead">
    <button class="icon" id="back" title="Volver">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="t"><h2 id="s-title"></h2><span id="s-by"></span></div>
    <div class="kpick" id="s-keys"></div>
    <button class="icon" id="fitBtn" title="Ajustar para que quepa entera en la pantalla">
      <svg viewBox="0 0 24 24"><path d="M4 9V5a1 1 0 011-1h4M20 9V5a1 1 0 00-1-1h-4M4 15v4a1 1 0 001 1h4M20 15v4a1 1 0 01-1 1h-4"/></svg>
    </button>
    <button class="icon" id="colsBtn" title="1, 2 o 3 columnas">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="9.75" y="4" width="4.5" height="16" rx="1"/><rect x="16.5" y="4" width="4.5" height="16" rx="1"/></svg>
      <b id="colsN">2</b>
    </button>
  </div>
  <div class="sbody" id="s-body"></div>
  <div class="fab">
    <button id="minus" title="Letra más pequeña">A−</button>
    <span class="lbl" id="size"></span>
    <button id="plus" title="Letra más grande">A+</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DATA = __SONG_DATA__;

const $ = s => document.querySelector(s);
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };

/* Preferences survive between Sundays. Wrapped because a tablet in
   private mode, or with site data blocked, throws on access. */
const store = {
  get(k, d) { try { const v = localStorage.getItem('eicw.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('eicw.' + k, JSON.stringify(v)); } catch {} }
};

let size = store.get('size', 16);
let colCount = store.get('cols3', 2);
let auto = store.get('auto', true);
let svcIx = 0;
let current = null;   // {song, key}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 1700);
}

/* ---------- theme ---------- */
function applyTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  $('#theme').classList.toggle('on', dark);
  store.set('dark', dark);
}
applyTheme(store.get('dark', false));
$('#theme').onclick = () =>
  applyTheme(document.documentElement.getAttribute('data-theme') !== 'dark');

/* ---------- font size ---------- */
function applySize() {
  document.documentElement.style.setProperty('--song-size', size + 'px');
  $('#size').textContent = size + 'px';
  store.set('size', size);
  $('#fitBtn').classList.toggle('on', auto);
}
/* Tocar el tamano a mano apaga el ajuste automatico: manda el. */
$('#plus').onclick  = () => { size = Math.min(44, size + 1); auto = false; store.set('auto', false); applySize(); };
$('#minus').onclick = () => { size = Math.max(10, size - 1); auto = false; store.set('auto', false); applySize(); };
applySize();

/* ---------- columns ---------- */
function applyCols() {
  const box = $('#s-body').querySelector('.cols');
  if (box) {
    box.classList.remove('c2', 'c3');
    if (colCount > 1) box.classList.add('c' + colCount);
  }
  $('#colsN').textContent = colCount;
  store.set('cols3', colCount);
}
$('#colsBtn').onclick = () => {
  colCount = colCount % 3 + 1;
  auto = false; store.set('auto', false);
  applyCols(); applySize();
  toast(colCount === 1 ? 'Una columna' : colCount + ' columnas');
};

/* ---------- fit the whole song on one screen ----------
   The point of the tablet is to stop turning pages, so the useful
   question is not "what size do I like" but "what is the largest
   size at which this song still fits". That is measurable: set a
   size, ask whether the body still scrolls, binary-search the rest.

   Columns belong to the same answer — three narrow columns often
   allow bigger type than one wide one — so every count is tried and
   whichever yields the largest type wins. Ties go to fewer columns,
   which read more naturally. */
function bestFor(n) {
  const body = $('#s-body');
  const box = body.querySelector('.cols');
  if (!box) return { size: 10, fits: false };

  box.classList.remove('c2', 'c3');
  if (n > 1) box.classList.add('c' + n);

  let lo = 10, hi = 44, best = 10, fits = false;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    document.documentElement.style.setProperty('--song-size', mid + 'px');
    void body.offsetHeight;                      // force reflow
    if (body.scrollHeight <= body.clientHeight + 2) {
      best = mid; fits = true; lo = mid + 1;
    } else hi = mid - 1;
  }
  return { size: best, fits };
}

function autoFit(quiet) {
  let bestSize = 0, bestN = colCount, ok = false;
  for (const n of [1, 2, 3]) {
    const r = bestFor(n);
    if (r.size > bestSize) { bestSize = r.size; bestN = n; ok = r.fits; }
  }
  colCount = bestN;
  size = bestSize || 10;
  applyCols(); applySize();
  if (quiet) return;
  toast(ok ? `Cabe entera · ${size}px · ${colCount} col.`
           : `No cabe ni a 10px · ${colCount} col.`);
}

function fitWhenSettled(quiet = true) {
  requestAnimationFrame(() =>
    requestAnimationFrame(() => autoFit(quiet)));
}

$('#fitBtn').onclick = () => {
  auto = true; store.set('auto', true);
  fitWhenSettled(false);
};

/* Turning the tablet changes the space available, so a fit made in
   portrait is wrong in landscape. Recalculated on rotation, and
   debounced because Android fires resize repeatedly mid-turn. */
let resizeT;
addEventListener('resize', () => {
  if (!auto || !$('#sheet').classList.contains('on')) return;
  clearTimeout(resizeT);
  resizeT = setTimeout(() => fitWhenSettled(true), 180);
});

/* ---------- keep the screen on ----------
   A song lasts longer than the screen timeout, and the tablet going
   dark mid-verse is the whole reason paper felt safer. */
let lock = null;
$('#awake').onclick = async () => {
  try {
    if (lock) { await lock.release(); lock = null; $('#awake').classList.remove('on'); toast('Pantalla normal'); }
    else {
      lock = await navigator.wakeLock.request('screen');
      lock.addEventListener('release', () => { lock = null; $('#awake').classList.remove('on'); });
      $('#awake').classList.add('on'); toast('La pantalla no se apagará');
    }
  } catch { toast('Este navegador no permite mantener la pantalla encendida'); }
};
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && $('#awake').classList.contains('on') && !lock) {
    try { lock = await navigator.wakeLock.request('screen'); } catch {}
  }
});

/* ---------- rendering a chart ----------
   Each word is its own inline-block so the chord can be absolutely
   positioned above it. That is what lets the text reflow at any
   font size and any column width without the chords drifting off
   the syllable they belong to. */
function renderLine(line) {
  const hasChord = line.parts.some(p => p.chord);
  const p = el('p', 'ln' + (hasChord ? ' c' : ''));

  /* A line with no chords is plain text, so it stays compact and
     wraps like prose. */
  if (!hasChord) {
    p.textContent = line.parts.map(x => x.text || '').join('');
    return p;
  }

  /* Otherwise every word becomes its own grid cell and the chord
     rides in the cell of the word it is played on. Trailing spaces
     stay glued to their word so the wrap points are the real ones. */
  line.parts.forEach(part => {
    const chunks = (part.text || '').match(/\S+\s*|\s+/g) || [];
    if (!chunks.length) chunks.push(' ');   // a chord with no word

    chunks.forEach((chunk, i) => {
      const span = el('span', 'w');
      const b = document.createElement('b');
      b.textContent = (i === 0 && part.chord) ? part.chord : '';
      const txt = document.createElement('i');
      txt.textContent = chunk;
      span.appendChild(b);
      span.appendChild(txt);
      p.appendChild(span);
    });
  });
  return p;
}

function renderSong(song) {
  const wrap = el('div', 'sheet-in');
  const meta = el('div', 'meta');
  const bits = [];
  if (song.meta.capo)           bits.push('Capo ' + song.meta.capo);
  if (song.meta.sounds_in)      bits.push('Suena en ' + song.meta.sounds_in);
  if (song.meta.time_signature) bits.push(song.meta.time_signature);
  if (song.meta.tempo)          bits.push(song.meta.tempo);
  bits.forEach(b => { const i = el('i'); i.textContent = b; meta.appendChild(i); });
  if (bits.length) wrap.appendChild(meta);

  const cols = el('div', 'cols');
  song.sections.forEach(sec => {
    const s = el('div', 'sec');
    if (sec.label) { const h = el('h4'); h.textContent = sec.label; s.appendChild(h); }
    sec.lines.forEach(l => s.appendChild(renderLine(l)));
    if (!sec.lines.length) s.appendChild(el('div', 'gap'));
    cols.appendChild(s);
  });
  wrap.appendChild(cols);
  return wrap;
}

function openSong(entry, key) {
  current = { entry, key: key || entry.default_key };
  const song = entry.keys[current.key];

  $('#s-title').textContent = song.title;
  $('#s-by').textContent = [song.author, 'Tono ' + current.key].filter(Boolean).join(' · ');

  const kp = $('#s-keys'); kp.innerHTML = '';
  DATA.keys.forEach(k => {
    const b = el('button');
    b.textContent = k;
    const have = !!entry.keys[k];
    b.disabled = !have;
    b.setAttribute('aria-pressed', k === current.key);
    b.title = have ? 'Tocar en ' + k : 'No disponible en ' + k;
    if (have) b.onclick = () => openSong(entry, k);
    kp.appendChild(b);
  });

  const body = $('#s-body');
  body.innerHTML = '';
  body.appendChild(renderSong(song));
  body.scrollTop = 0;
  applyCols();
  $('#sheet').classList.add('on');
  // Cada cancion tiene su propio largo, asi que el ajuste se
  // recalcula al abrirla, no una vez y para siempre. Dos frames
  // porque medir en el primero, antes de que el navegador haya
  // asentado las columnas, devuelve alturas que aun cambian.
  if (auto) fitWhenSettled();
}

$('#back').onclick = () => $('#sheet').classList.remove('on');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#sheet').classList.remove('on');
  if (!$('#sheet').classList.contains('on')) return;
  if (e.key === '+' || e.key === '=') $('#plus').click();
  if (e.key === '-') $('#minus').click();
});

/* ---------- lists ---------- */
function card(entry, n) {
  const b = el('button', 'card');
  b.style.animationDelay = (n * 45) + 'ms';
  if (n !== null) { const i = el('span', 'n'); i.textContent = (n + 1); b.appendChild(i); }
  const h = el('h3'); h.textContent = entry.title; b.appendChild(h);
  const by = el('p', 'by'); by.textContent = entry.author || ' '; b.appendChild(by);
  const ks = el('div', 'keys');
  DATA.keys.forEach(k => {
    const i = el('i'); i.textContent = k;
    if (entry.keys[k]) i.className = 'has';
    ks.appendChild(i);
  });
  b.appendChild(ks);
  b.onclick = () => openSong(entry);
  return b;
}

function drawSet() {
  const svc = DATA.services[svcIx];
  const grid = $('#set-grid'); grid.innerHTML = '';
  $('#set-title').textContent = svc ? svc.name : 'Domingo';
  $('#set-sub').textContent = svc
    ? [svc.date, svc.title, svc.songs.length + ' canciones'].filter(Boolean).join('  ·  ')
    : '';
  $('#sub').textContent = svc ? svc.date : 'EIC Paris';

  if (!svc || !svc.songs.length) {
    const e = el('div', 'empty');
    e.textContent = 'No hay canciones para este servicio todavía.';
    grid.appendChild(e);
    return;
  }
  svc.songs.forEach((s, i) => grid.appendChild(card(s, i)));
}

function drawSvc() {
  const box = $('#svc'); box.innerHTML = '';
  if (DATA.services.length < 2) return;
  DATA.services.forEach((s, i) => {
    const b = el('button');
    b.textContent = s.name;
    b.setAttribute('aria-pressed', i === svcIx);
    b.onclick = () => { svcIx = i; drawSvc(); drawSet(); };
    box.appendChild(b);
  });
}

function drawArchive() {
  const grid = $('#arch-grid'); grid.innerHTML = '';
  $('#arch-sub').textContent = DATA.archive.length
    ? DATA.archive.length + ' canciones · orden alfabético'
    : '';
  if (!DATA.archive.length) {
    const e = el('div', 'empty');
    e.textContent = 'El archivo se irá llenando con las canciones de cada domingo.';
    grid.appendChild(e);
    return;
  }
  DATA.archive.forEach((s, i) => grid.appendChild(card(s, null)));
}

document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
    $(t.dataset.view === 'set' ? '#v-set' : '#v-arch').classList.add('on');
  };
});

drawSvc(); drawSet(); drawArchive();
</script>
